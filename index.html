<!DOCTYPE html>
<html lang="en">

<head>
    <!-- metadata below sets character set, viewport settings, meta description, keywords for SEO, author and Title of the page. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Huxly.AI - AI-powered ESG and Sustainability Data Platform">
    <meta name="keywords"
        content="Huxly.AI, ESG, Sustainability, AI-powered, Data Platform, Environmental, Social, Governance, Analytics">
    <meta name="author" content="Luke Thompson">
    <title>Huxly.AI - Home</title>
    <!-- link elements below includes bootstrap and original stylesheets into the page. -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- embedding fonts from google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- header contains primary navbar which is fixed using CSS -->
    <header>
        <!-- Navbar code and style is repurposed from bootstrap's components library -->
        <nav class="navbar navbar-expand-lg bg-body-tertiary" id="primary-nav">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Huxly.AI</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!-- Navbar is built as an unordered list, use of flexbox to justify the navbar ul to the right of the div. -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav d-flex justify-content-end w-100">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Features</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Demo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Pricing</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <!-- hero section semantically structured -->
    <section>
        <div class="hero-section">
            <!-- hero image with responsive deisgn and aria label for accessibilty
            image was generated using chatGPT and the "Ivory Glow" colour palette from Figma -->
            <img src="assets/img/hero-desktop-1.png" media="(min-width:550px)"
                aria-label="Hero Image background showing an abstract and minimalist design with orange and blue tones representing sustainability and technology."
                alt="Abstract Hero Image desktop">

            <!-- h1 and p elements' variable font classes import font from google -->
            <h1 class="inter-bold-700">The AI suite to power your green transition.</h1>
            <p class="inter-normal-400">Harness the power of AI to meet ESG goals and identify blind spots in your
                business.</p>

            <!-- buttons from bootstrap are links to relevant pages on the site -->
            <a href="#">
                <button type="button" class="btn btn-secondary btn-sm" id="mainbutton">
                    Pricing
                </button>
            </a>
            <a href="#">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="secondarybutton">
                    Features
                </button>
            </a>
        </div>
    </section>



    <!-- Script below is to enable bootstrap on the webpage. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
